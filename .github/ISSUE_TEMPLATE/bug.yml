name: Conversion bug
description: Report an incorrect or incompatible generated schema
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: engine
    attributes:
      label: Zod generation
      options: [Zod 3, Zod 4]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Exact versions
      placeholder: zod-schema-bridge 0.2.0, zod 4.x, Node 22.x
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: typescript
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and generated schema
      render: json
    validations:
      required: true
